<div class="message-bubble" [class.message-bubble-user]="isUser()">
  <p class="message-bubble-text">@for (segment of segments(); track $index) {@if (segment.isNarration) {<span class="message-bubble-narration">{{ segment.text }}</span>} @else {<span class="message-bubble-speech">{{ segment.text }}</span>}}</p>
</div>
