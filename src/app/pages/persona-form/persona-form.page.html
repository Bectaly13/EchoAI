<ion-header class="persona-form-header-wrap">
  <app-header class="persona-form-header"
    [title]="isEditing() ? 'Modifier le persona' : 'Nouveau persona'"
    [showBack]="true" (back)="cancel()"></app-header>
</ion-header>

<ion-content [fullscreen]="true" class="persona-form-content">

  <form class="persona-form-body" (ngSubmit)="save()">

    <label class="persona-form-label" for="name">Nom</label>
    <input class="persona-form-input" id="name" name="name" type="text"
      [(ngModel)]="name" placeholder="Ex. : Capitaine Léa Marchand" />

    @if (!isDefault) {
      <label class="persona-form-label" for="description">Description</label>
      <textarea class="persona-form-textarea" id="description" name="description" rows="8"
        [(ngModel)]="description"
        placeholder="Qui es-tu : comment on t'appelle, ton histoire, tes pouvoirs, ton rôle…"></textarea>
    }

    <button class="persona-form-save" type="submit">Enregistrer</button>

  </form>

</ion-content>
