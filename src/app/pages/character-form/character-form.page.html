<ion-header class="character-form-header-wrap">
  <app-header class="character-form-header"
    [title]="isEditing() ? 'Modifier le personnage' : 'Nouveau personnage'"
    [showBack]="true" [backTo]="['characters']"></app-header>
</ion-header>

<ion-content [fullscreen]="true" class="character-form-content">

  <form class="character-form-body" (ngSubmit)="save()">

    @if (!isEditing()) {
      <div class="character-form-assist">
        <label class="character-form-label" for="brief">Création par IA</label>
        <textarea class="character-form-textarea" id="brief" name="brief" rows="3"
          [(ngModel)]="brief"
          placeholder="Décris ton idée en quelques mots ; l'IA en fera une fiche complète, que tu pourras retoucher."></textarea>
        <button class="character-form-generate" type="button"
          (click)="generateDraft()" [disabled]="generating || !brief.trim()">
          {{ generating ? "Génération…" : "Générer la fiche" }}
        </button>
      </div>
    }

    @if (imageEnabled) {
      <div class="character-form-avatar">
        <p class="character-form-label">Photo de profil (optionnelle)</p>
        <div class="character-form-avatar-row">
          @if (avatarImage) {
            <img class="character-form-avatar-preview" [src]="avatarImage" alt="Aperçu de la photo de profil" />
          } @else {
            <div class="character-form-avatar-placeholder">?</div>
          }
          <div class="character-form-avatar-actions">
            <button class="character-form-generate" type="button"
              (click)="generateImage()" [disabled]="generatingImage">
              {{ generatingImage ? "Génération…" : (avatarImage ? "Régénérer l'image" : "Générer une image") }}
            </button>
            @if (avatarImage) {
              <button class="character-form-avatar-remove" type="button" (click)="removeImage()">Retirer</button>
            }
          </div>
        </div>
      </div>
    }

    <label class="character-form-label" for="name">Nom</label>
    <input class="character-form-input" id="name" name="name" type="text"
      [(ngModel)]="name" placeholder="Ex. : Alice" />

    <label class="character-form-label" for="prompt">Personnalité</label>
    <textarea class="character-form-textarea" id="prompt" name="prompt" rows="8"
      [(ngModel)]="systemPrompt"
      placeholder="Décris ce personnage."></textarea>

    <label class="character-form-label" for="greeting">Message d'accueil</label>
    <textarea class="character-form-textarea" id="greeting" name="greeting" rows="5"
      [(ngModel)]="greeting"
      placeholder="Premier message du personnage, pour planter le décor.&#10;Ex. :&#10;*Elle lève les yeux.*&#10;Alice : &quot;Te voilà enfin.&quot;"></textarea>

    <p class="character-form-section">Détails (optionnels)</p>

    <label class="character-form-label" for="appearance">Apparence</label>
    <textarea class="character-form-textarea" id="appearance" name="appearance" rows="3"
      [(ngModel)]="appearance"
      placeholder="Physique : cheveux, yeux, taille, corpulence, traits… (vêtements en secondaire)."></textarea>

    <label class="character-form-label" for="scenario">Scénario</label>
    <textarea class="character-form-textarea" id="scenario" name="scenario" rows="3"
      [(ngModel)]="scenario"
      placeholder="L'intrigue de départ : la situation qui plante l'histoire (au-delà du seul message d'accueil)."></textarea>

    <label class="character-form-label" for="setting">Univers / cadre</label>
    <textarea class="character-form-textarea" id="setting" name="setting" rows="3"
      [(ngModel)]="setting"
      placeholder="Le monde, l'époque, le lieu où se déroule l'histoire."></textarea>

    <label class="character-form-label" for="speechStyle">Façon de parler</label>
    <textarea class="character-form-textarea" id="speechStyle" name="speechStyle" rows="3"
      [(ngModel)]="speechStyle"
      placeholder="Registre de langue, tics de langage, accent, ton."></textarea>

    <label class="character-form-label" for="background">Histoire / passé</label>
    <textarea class="character-form-textarea" id="background" name="background" rows="3"
      [(ngModel)]="background"
      placeholder="Origines, événements marquants de sa vie."></textarea>

    <label class="character-form-label" for="initialRelationship">Relation initiale avec toi</label>
    <textarea class="character-form-textarea" id="initialRelationship" name="initialRelationship" rows="3"
      [(ngModel)]="initialRelationship"
      placeholder="Comment vous vous connaissez au début de l'histoire."></textarea>

    <label class="character-form-label" for="preferences">Goûts et préférences</label>
    <textarea class="character-form-textarea" id="preferences" name="preferences" rows="3"
      [(ngModel)]="preferences"
      placeholder="Ce qu'il aime ou non"></textarea>

    <label class="character-form-label" for="knownCharacters">Personnages qu'il connaît</label>
    <textarea class="character-form-textarea" id="knownCharacters" name="knownCharacters" rows="3"
      [(ngModel)]="knownCharacters"
      placeholder="Autres personnages qu'il connaît et la nature de ces liens."></textarea>

    <button class="character-form-save" type="submit">Enregistrer</button>

  </form>

</ion-content>
