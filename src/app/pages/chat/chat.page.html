<ion-header class="chat-header-wrap">
  <app-header class="chat-header" [title]="character?.name ?? ''" [showBack]="true" (back)="goBack()"></app-header>
</ion-header>

<div class="chat-actions">
  <button class="chat-persona" title="Choisir mon persona" (click)="choosePersona()">{{ activePersonaLabel() }}</button>
  <button class="chat-memory" title="Voir la mémoire" (click)="goToMemory()">🧠</button>
  <button class="chat-reset" title="Réinitialiser la conversation" (click)="confirmReset()">↺</button>
</div>

<ion-content class="chat-content">
  <div class="chat-messages">
    @for (message of messages; track message.id) {
      <app-message-bubble
        class="chat-bubble"
        [message]="message"
        [canRegenerate]="canRegenerate(message)"
        [canDelete]="canDelete(message)"
        (regenerate)="regenerate()"
        (remove)="confirmDelete(message)">
      </app-message-bubble>
    }
    @if (sending) {
      <p class="chat-typing">…</p>
    }
  </div>
</ion-content>

<footer class="chat-footer">
  <button class="chat-skip" type="button" title="Passer mon tour" (click)="skip()" [disabled]="sending">⏭</button>
  @if (imageEnabled) {
    <button class="chat-illustrate" type="button" title="Illustrer la scène" (click)="illustrate()" [disabled]="sending">🖼</button>
  }
  <input class="chat-input" type="text" name="draft"
    [(ngModel)]="draft" (keyup.enter)="send()" placeholder="Écris un message…" />
  <button class="chat-send" (click)="send()" [disabled]="sending">Envoyer</button>
</footer>
