<ion-header class="characters-header-wrap">
  <app-header class="characters-header" title="Personnages"></app-header>
</ion-header>

<ion-content [fullscreen]="true" class="characters-content">

  <div class="characters-toolbar">
    <button class="characters-add" (click)="goToCreate()">+ Nouveau personnage</button>
  </div>

  @if (characters.length === 0) {
    <div class="characters-empty">
      <p class="characters-empty-text">Aucun personnage pour l'instant.</p>
    </div>
  } @else {
    <div class="characters-list">
      @for (character of characters; track character.id) {
        <app-character-card
          class="characters-card"
          [character]="character"
          (open)="goToEdit(character)"
          (remove)="confirmRemove(character)">
        </app-character-card>
      }
    </div>
  }

</ion-content>

<app-navbar class="characters-navbar"></app-navbar>

<app-modal [open]="namePrompt.open" title="Comment t'appelles-tu ?" (dismiss)="namePrompt.open = false">
  <p class="characters-modal-text">Ce nom est ton persona par défaut, transmis aux personnages. Tu pourras le modifier dans « Personas ».</p>
  <input class="characters-modal-input" type="text" name="userName" [(ngModel)]="namePrompt.value" placeholder="Ton nom" />
  <div class="characters-genders">
    @for (option of genderOptions; track option.value) {
      <button class="characters-gender" type="button"
        [class.active]="namePrompt.gender === option.value" (click)="namePrompt.gender = option.value">
        {{ option.label }}
      </button>
    }
  </div>
  <div class="characters-modal-actions" modalFooter>
    <button class="modal-btn" type="button" (click)="namePrompt.open = false">Plus tard</button>
    <button class="modal-btn modal-btn-primary" type="button" (click)="saveUserName()">Valider</button>
  </div>
</app-modal>

<app-confirm-modal
  [open]="confirmModal.open"
  [title]="confirmModal.title"
  [message]="confirmModal.message"
  [confirmLabel]="confirmModal.confirmLabel"
  (confirm)="runConfirm()"
  (cancelled)="confirmModal.open = false">
</app-confirm-modal>
