<ion-header class="characters-header-wrap">
  <app-header class="characters-header" title="Personnages"></app-header>
</ion-header>

<ion-content [fullscreen]="true" class="characters-content">

  <div class="characters-toolbar">
    <button class="characters-add" (click)="goToCreate()">+ Nouveau personnage</button>
  </div>

  @if (characters.length === 0) {
    <div class="characters-empty">
      <p class="characters-empty-text">Aucun personnage pour l'instant.</p>
    </div>
  } @else {
    <div class="characters-list">
      @for (character of characters; track character.id) {
        <app-character-card
          class="characters-card"
          [character]="character"
          (open)="goToChat(character)"
          (edit)="goToEdit(character)"
          (remove)="confirmRemove(character)">
        </app-character-card>
      }
    </div>
  }

</ion-content>

<app-navbar class="characters-navbar"></app-navbar>
